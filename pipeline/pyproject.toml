[project]
name = "shuvit-pipeline"
version = "0.1.0"
description = "Shuvit skatepark data scraper and loader"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "thefuzz[speedup]>=0.22",
    "asyncpg>=0.29",
    "typer>=0.12",
    "rich>=13.0",
]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
