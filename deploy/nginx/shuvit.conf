upstream shuvit_api {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name api.shuvit.app;

    # Redirect HTTP to HTTPS (certbot will manage this)
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.shuvit.app;

    # SSL certs managed by certbot
    # ssl_certificate /etc/letsencrypt/live/api.shuvit.app/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.shuvit.app/privkey.pem;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip
    gzip on;
    gzip_types application/json text/plain application/javascript;
    gzip_min_length 256;

    # Client body size (for media uploads)
    client_max_body_size 25M;

    # API proxy
    location /api/ {
        proxy_pass http://shuvit_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Health check
    location /health {
        proxy_pass http://shuvit_api;
    }

    # Serve media files directly from disk
    location /media/ {
        alias /opt/shuvit/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
